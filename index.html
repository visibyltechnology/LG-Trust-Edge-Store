    <style>
      /* Hide scrollbar utility */
      .hide-scrollbar::-webkit-scrollbar { display: none; }
      .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* Marquee (double content for seamless loop) */
      .marquee-inner {
        display: inline-flex;
        animation: marquee 40s linear infinite;
        white-space: nowrap;
      }
      @keyframes marquee {
        0%   { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }

      /* Product card hover */
      .product-card-container {
        background: #fff;
        border: 1px solid #eee;
        border-radius: 8px;
        transition: all 0.25s ease;
      }
      .product-card-container:hover {
        box-shadow: 0 8px 30px rgba(0,0,0,0.10);
        border-color: #E2001A;
        transform: translateY(-3px);
      }

      /* Line clamp utilities */
      .line-clamp-1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
      .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

      /* Category card */
      .cat-card { transition: all 0.22s ease; border: 2px solid transparent; }
      .cat-card:hover { border-color: #E2001A; transform: translateY(-4px); box-shadow: 0 10px 30px rgba(226,0,26,0.12); }

      /* Custom scrollbar */
      ::-webkit-scrollbar { width: 5px; }
      ::-webkit-scrollbar-track { background: #f1f1f1; }
      ::-webkit-scrollbar-thumb { background: #E2001A; border-radius: 3px; }

      /* Glass card */
      .glass-card {
        background: rgba(255,255,255,0.10);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255,255,255,0.18);
      }

      /* Skeleton shimmer */
      .skeleton {
        background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
      }
      @keyframes shimmer {
        0%   { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }

        font-family: 'Inter', sans-serif;
        background-color: #f4f5f8;
        -webkit-font-smoothing: antialiased;
